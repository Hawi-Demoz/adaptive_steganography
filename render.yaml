services:
  - type: web
    name: adaptive-steganography-api
    runtime: python
    rootDir: web/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_FILE
        value: /var/data/auth.json
    disk:
      name: adaptive-steganography-data
      mountPath: /var/data
      sizeGB: 1